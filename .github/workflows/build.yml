name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Run Unit Tests
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "========== TEST RESULTS =========="
          grep -E "FAILED|> Task|BUILD|Exception|Error|Caused by|Test.*FAILED|tests completed" test-output.log | tail -60
          echo "=================================="
          exit $EXIT_CODE
        continue-on-error: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK=$(find app/build -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            echo "✓ APK built: $APK"
            ls -lh "$APK"
            mkdir -p apk-output
            cp "$APK" apk-output/launchit-debug.apk
          else
            echo "✗ No APK found"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: launchit-debug-apk
          path: apk-output/launchit-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            test-output.log
          retention-days: 7
