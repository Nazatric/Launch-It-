name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Build Debug APK
        id: build
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build-output.log 2>&1
          EXIT_CODE=$?
          set -e
          echo "Build exit code: $EXIT_CODE"
          echo "========================================="
          echo "BUILD OUTPUT (last 200 lines):"
          echo "========================================="
          tail -200 build-output.log
          echo "========================================="
          echo "COMPILATION ERRORS:"
          echo "========================================="
          grep "^e:" build-output.log || echo "No compilation errors found"
          echo "========================================="
          exit $EXIT_CODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          retention-days: 7

      - name: Verify APK
        run: |
          APK=$(find app/build -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            echo "✓ APK built: $APK"
            ls -lh "$APK"
            mkdir -p apk-output
            cp "$APK" apk-output/launchit-debug.apk
          else
            echo "✗ No APK found"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: launchit-debug-apk
          path: apk-output/launchit-debug.apk
          retention-days: 30
          if-no-files-found: error
